<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab & Bookmark Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <!-- ページナビゲーション -->
    <div class="nav-bar">
      <button id="navBack" class="nav-btn" title="戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <button id="navForward" class="nav-btn" title="進む">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
      <button id="navReload" class="nav-btn" title="再読み込み">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 4v6h6"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
      </button>
      <div class="nav-spacer"></div>
      <button id="navFullscreen" class="nav-btn" title="全画面切替">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>

    <!-- タブ切り替え -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="tabs">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18"/>
          <path d="M9 3v6"/>
        </svg>
        <span>タブ</span>
      </button>
      <button class="tab-btn" data-tab="bookmarks">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <span>ブックマーク</span>
      </button>
      <button class="tab-btn" data-tab="tools">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 9.36l-7.1 7.1a1 1 0 0 1-1.4 0l-2.8-2.8a1 1 0 0 1 0-1.4l7.1-7.1a6 6 0 0 1 9.36-7.94z"/>
        </svg>
        <span>ツール</span>
      </button>
      <div class="tab-indicator"></div>
    </nav>
  </header>

  <!-- アドレスバー -->
  <div class="address-bar" id="addressBarContainer">
    <svg class="address-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      <path d="M2 12h20"/>
    </svg>
    <input type="text" id="addressInput" placeholder="URLまたは検索キーワードを入力..." autocomplete="off">
  </div>

  <!-- コンテンツエリア -->
  <main class="content">
    <!-- タブ一覧 -->
    <section id="tabsPanel" class="panel active">
      <div class="panel-actions">
        <button id="newTabBtn" class="action-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>新規タブを追加</span>
        </button>
      </div>
      <div id="tabsList" class="list"></div>
      <div id="tabsEmpty" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18"/>
        </svg>
        <p>タブが見つかりません</p>
      </div>
    </section>

    <!-- ブックマーク一覧 -->
    <section id="bookmarksPanel" class="panel">
      <div id="bookmarksList" class="list"></div>
      <div id="bookmarksEmpty" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <p>ブックマークが見つかりません</p>
      </div>
    </section>

    <!-- ツール一覧 -->
    <section id="toolsPanel" class="panel">
      <div class="settings-group">
        <div class="setting-item">
          <div class="setting-info">
            <div class="setting-title">X (Twitter) 右サイドバー非表示</div>
            <div class="setting-desc">おすすめトレンド等を隠します</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleXSidebar">
            <span class="toggle-slider"></span>
          </label>
        </div>
        
      </div>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
