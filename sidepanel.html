<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab & Bookmark Panel</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <!-- ページナビゲーション -->
    <div class="nav-bar">
      <button id="navBack" class="nav-btn" title="戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <button id="navForward" class="nav-btn" title="進む">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
      <button id="navReload" class="nav-btn" title="再読み込み">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 4v6h6"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
      </button>
      <div class="nav-spacer"></div>
      <button id="navFullscreen" class="nav-btn" title="全画面切替">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>

    <!-- タブ切り替え -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="tabs">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18"/>
          <path d="M9 3v6"/>
        </svg>
        <span>タブ</span>
      </button>
      <button class="tab-btn" data-tab="bookmarks">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <span>ブックマーク</span>
      </button>
      <button class="tab-btn" data-tab="tools">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 9.36l-7.1 7.1a1 1 0 0 1-1.4 0l-2.8-2.8a1 1 0 0 1 0-1.4l7.1-7.1a6 6 0 0 1 9.36-7.94z"/>
        </svg>
        <span>ツール</span>
      </button>
      <div class="tab-indicator"></div>
    </nav>
  </header>

  <!-- アドレスバー -->
  <div class="address-bar" id="addressBarContainer">
    <svg class="address-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      <path d="M2 12h20"/>
    </svg>
    <input type="text" id="addressInput" placeholder="URLまたは検索キーワードを入力..." autocomplete="off">
    <button id="bookmarkPageBtn" class="address-bar-btn" title="ブックマークに追加">
      <svg class="star-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </button>
  </div>

  <!-- コンテンツエリア -->
  <main class="content">
    <!-- タブ一覧 -->
    <section id="tabsPanel" class="panel active">
      <div class="panel-actions">
        <button id="newTabBtn" class="action-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          <span>新規タブを追加</span>
        </button>
      </div>
      <div id="tabsList" class="list"></div>
      <div id="tabsEmpty" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18"/>
        </svg>
        <p>タブが見つかりません</p>
      </div>
    </section>

    <!-- ブックマーク一覧 -->
    <section id="bookmarksPanel" class="panel">
      <div id="bookmarksList" class="list"></div>
      <div id="bookmarksEmpty" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <p>ブックマークが見つかりません</p>
      </div>
    </section>

    <!-- ツール一覧 -->
    <section id="toolsPanel" class="panel">
      <div class="settings-group">
        <div class="setting-item">
          <div class="setting-info">
            <div class="setting-title">X (Twitter) 右サイドバー非表示</div>
            <div class="setting-desc">おすすめトレンド等を隠します</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleXSidebar">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <div class="setting-info">
            <div class="setting-title">YouTube Shorts 自動送り</div>
            <div class="setting-desc">ショート動画終了時に自動で次へ進みます</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleYtShortsAutoScroll">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- AI音声入力ツール -->
      <div class="settings-group" style="margin-top: 16px;">
        <div class="setting-item" style="flex-direction: column; align-items: stretch; gap: 12px; padding: 12px;">
          <div class="setting-info" style="margin-bottom: 4px;">
            <div class="setting-title">AI音声入力 (Gemini)</div>
            <div class="setting-desc">音声で入力し、Geminiでテキスト化・文章作成を行います</div>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="password" id="geminiApiKey" placeholder="Gemini APIキー" style="flex: 1; padding: 6px; border-radius: 4px; border: 1px solid var(--border-color, #ccc); background: var(--bg-color, #fff); color: var(--text-color, #333);">
            <button id="saveApiKeyBtn" class="action-btn" style="padding: 6px 12px; flex-shrink: 0; flex: none;" title="APIキーを保存">保存</button>
            <button id="checkModelsBtn" class="action-btn" style="padding: 6px 12px; flex-shrink: 0; flex: none;" title="利用可能なモデルを確認">確認</button>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 8px 0; gap: 8px;">
            <button id="voiceInputBtn" class="action-btn" style="width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; background-color: var(--primary-color, #007bff); color: white; flex: none;" title="録音開始">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 24px; height: 24px;">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
            <div style="display: flex; align-items: center; gap: 12px;">
              <div id="voiceStatus" style="font-size: 12px; color: var(--text-muted, #666);">待機中</div>
              <button id="copyResultBtn" class="action-btn" style="padding: 4px 8px; font-size: 11px; display: flex; align-items: center; gap: 4px; flex: none;" title="結果をコピー">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                  <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                <span>コピー</span>
              </button>
              <button id="cancelVoiceBtn" class="action-btn hidden" style="padding: 4px 8px; font-size: 11px; display: flex; align-items: center; gap: 4px; flex: none; color: var(--danger); border-color: var(--danger);" title="録音をキャンセル">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                  <path d="M18 6 6 18M6 6l12 12"/>
                </svg>
                <span>中止</span>
              </button>
            </div>
          </div>
          <textarea id="voiceResultArea" rows="5" placeholder="認識結果やAIの回答がここに表示されます..." style="width: 100%; border-radius: 4px; border: 1px solid var(--border-color, #ccc); background: var(--bg-color, #fff); color: var(--text-color, #333); padding: 8px; resize: vertical; box-sizing: border-box;"></textarea>
        </div>
      </div>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
